name: novexfinance

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novexfinance-app
    restart: always
    ports:
      - "${NOVEX_HTTP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET obrigatorio}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL obrigatoria}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL obrigatoria}
      CREDENTIALS_ENCRYPTION_KEY_BASE64: ${CREDENTIALS_ENCRYPTION_KEY_BASE64:?CREDENTIALS_ENCRYPTION_KEY_BASE64 obrigatoria}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:?MERCADO_PAGO_WEBHOOK_SECRET obrigatorio}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET obrigatorio}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}@db:5432/${POSTGRES_DB:?POSTGRES_DB obrigatorio}
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY obrigatoria}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-novex-finance}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novexfinance-worker
    restart: always
    environment:
      NODE_ENV: production
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET obrigatorio}
    depends_on:
      app:
        condition: service_healthy
    command:
      - node
      - -e
      - "const run=async()=>{try{const r=await fetch('http://app:3000/api/worker/run',{method:'POST',headers:{authorization:'Bearer '+process.env.WORKER_SECRET}});if(!r.ok)console.error('worker HTTP',r.status,await r.text())}catch(e){console.error('worker request',e.message)}};run();setInterval(run,15000)"

  db:
    image: postgres:16-alpine
    container_name: novexfinance-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
    ports:
      - "5432:5432"
    volumes:
      - novex_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novexfinance-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - novex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: novexfinance-evolution
    restart: always
    ports:
      - "8081:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8081}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY obrigatoria}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}@db:5432/evolution_db?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: true
      CACHE_REDIS_ENABLED: true
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: true
      DEL_INSTANCE: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  novex_postgres_data:
  novex_redis_data:
