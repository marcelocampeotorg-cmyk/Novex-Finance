name: novexfinance

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novexfinance-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://novex:novex_dev_password@db:5432/novex_finance
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: 42960010999
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: novexfinance-db
    restart: always
    environment:
      POSTGRES_USER: novex
      POSTGRES_PASSWORD: novex_dev_password
      POSTGRES_DB: novex_finance
    ports:
      - "5432:5432"
    volumes:
      - novex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novexfinance-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - novex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.2.0
    container_name: novexfinance-evolution
    restart: always
    ports:
      - "8081:8080"
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: 42960010999
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://novex:novex_dev_password@db:5432/evolution_db?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: false
      CACHE_REDIS_URI: redis://redis:6379/1

volumes:
  novex_postgres_data:
  novex_redis_data:
